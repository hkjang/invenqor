name: Publish Server Container

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/invenqor-server

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Invenqor Server
            org.opencontainers.image.description=Invenqor IT asset management server

      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify anonymous pull contract and platforms
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image="${IMAGE_NAME}:${version}"
          anonymous_config="$(mktemp -d)"
          trap 'rm -rf "$anonymous_config" manifest.json' EXIT

          for attempt in {1..12}; do
            if DOCKER_CONFIG="$anonymous_config" docker buildx imagetools inspect \
              --raw "$image" > manifest.json 2>/dev/null; then
              break
            fi
            if [[ "$attempt" == 12 ]]; then
              echo "The published image is not anonymously readable: $image" >&2
              exit 1
            fi
            sleep 5
          done

          jq -e '
            [.manifests[].platform | (.os + "/" + .architecture)]
            | index("linux/amd64") != null and index("linux/arm64") != null
          ' manifest.json >/dev/null
