name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Test the management console
        run: npm test
        working-directory: web
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Validate the public OpenAPI contract
        run: npx --yes @redocly/cli@2.47.0 lint openapi.yaml
      - run: npm run build
        working-directory: web
      - name: Verify the checked-in Server UI matches the React build
        run: git diff --exit-code -- server/internal/webui/dist
      - name: Verify release PDFs contain no local build links
        run: |
          if grep -a -l '/URI (file://' docs/*.pdf; then
            echo 'A release PDF contains a local file:// link.' >&2
            exit 1
          fi
      - run: go test ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go build ./cmd/invenqor-server
        working-directory: server

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  static-build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cpu: x86-64
            artifact: invenqor-agent
          - target: aarch64-unknown-linux-musl
            cpu: generic
            artifact: invenqor-agent
          - target: x86_64-pc-windows-gnu
            cpu: x86-64
            artifact: invenqor-agent.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: houseabsolute/actions-rust-cross@v1
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
      - run: file target/${{ matrix.target }}/release/${{ matrix.artifact }}
      - name: Build the exact Windows release package for native E2E
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            target-windows-x86_64/x86_64-pc-windows-gnu/release \
            ci-artifacts
          cp \
            target/x86_64-pc-windows-gnu/release/invenqor-agent.exe \
            target-windows-x86_64/x86_64-pc-windows-gnu/release/invenqor-agent.exe
          SKIP_SCRIPT_VERIFY=1 OUTPUT_DIR="$PWD/ci-artifacts" \
            ./packaging/build-zip.sh x86_64-pc-windows-gnu
          (cd ci-artifacts && sha256sum --strict -c \
            invenqor-agent-windows-x86_64.zip.sha256)
      - name: Publish the Windows release ZIP for native E2E
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: invenqor-agent-windows-package
          path: |
            ci-artifacts/invenqor-agent-windows-x86_64.zip
            ci-artifacts/invenqor-agent-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  windows-native-e2e:
    needs: static-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Download and verify the exact Windows release ZIP
        uses: actions/download-artifact@v8
        with:
          name: invenqor-agent-windows-package
          path: target/release-package
      - name: Verify and extract the Windows release ZIP
        shell: pwsh
        run: |
          $zip = Resolve-Path 'target/release-package/invenqor-agent-windows-x86_64.zip'
          $sidecar = Get-Content 'target/release-package/invenqor-agent-windows-x86_64.zip.sha256' -Raw
          $expected = ($sidecar.Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Windows release ZIP checksum mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath 'target/release-package/extracted'
      - name: Verify the packaged release binary starts on native Windows
        run: ./target/release-package/extracted/invenqor-agent-windows-x86_64/bin/invenqor-agent.exe --version
        shell: pwsh
      - run: go build -o invenqor-server.exe ./cmd/invenqor-server
        working-directory: server
      - run: ./scripts/e2e-windows.ps1 -AgentPackageRoot ./target/release-package/extracted/invenqor-agent-windows-x86_64
        shell: pwsh
