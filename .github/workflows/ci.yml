name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Test the management console
        run: npm test
        working-directory: web
      - name: Audit production web dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Validate the public OpenAPI contract
        run: npx --yes @redocly/cli@2.47.0 lint openapi.yaml
      - run: npm run build
        working-directory: web
      - name: Verify the checked-in Server UI matches the React build
        run: git diff --exit-code -- server/internal/webui/dist
      - name: Verify release PDFs contain no local build links
        run: |
          if grep -a -l '/URI (file://' docs/*.pdf; then
            echo 'A release PDF contains a local file:// link.' >&2
            exit 1
          fi
      - run: go test ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go build ./cmd/invenqor-server
        working-directory: server

  server-postgres:
    # The suite defaults to the SQLite fallback because it needs nothing
    # installed, and that let two defects reach production while every test
    # passed: a LIKE on a JSONB column that failed every ingest with SQLSTATE
    # 42883, and one parameter reused for two columns whose types PostgreSQL
    # deduced differently, which made every relation approval return HTTP 500.
    # Neither is reachable from SQLite. See scripts/test-postgres.sh.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: invenqor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test against PostgreSQL
        run: go test ./...
        working-directory: server
        env:
          INVENQOR_TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/invenqor?sslmode=disable

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  dependency-audit:
    # The web dependencies were already audited on every run; the Rust and Go
    # ones were not. This agent runs as root under systemd and as SYSTEM under
    # the Windows service manager, so a dependency with a known hole is worth
    # the same attention there. Both trees are clean as of this commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      # Pinned: 0.22.2 and later need rustc 1.88, and this project builds on
      # 1.85 so that the agent keeps running on older distributions.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.1
      - name: Audit the Agent dependencies
        # A newly published advisory will fail this on a change that has nothing
        # to do with it. That is the intended trade: fix it, or record the
        # decision with --ignore RUSTSEC-0000-0000 and a reason.
        run: cargo audit
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Audit the Server dependencies
        # Reports vulnerabilities this code actually reaches, so a finding here
        # is a call path and not just a version match. One advisory currently
        # sits in the tree without being called - golang.org/x/crypto/openpgp,
        # unmaintained, no fix published - and govulncheck correctly ignores it.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        working-directory: server

  static-build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cpu: x86-64
            artifact: invenqor-agent
          - target: aarch64-unknown-linux-musl
            cpu: generic
            artifact: invenqor-agent
          - target: x86_64-pc-windows-gnu
            cpu: x86-64
            artifact: invenqor-agent.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: houseabsolute/actions-rust-cross@v1
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
      - run: file target/${{ matrix.target }}/release/${{ matrix.artifact }}
      - name: Build the exact Windows release package for native E2E
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            target-windows-x86_64/x86_64-pc-windows-gnu/release \
            ci-artifacts
          cp \
            target/x86_64-pc-windows-gnu/release/invenqor-agent.exe \
            target-windows-x86_64/x86_64-pc-windows-gnu/release/invenqor-agent.exe
          SKIP_SCRIPT_VERIFY=1 OUTPUT_DIR="$PWD/ci-artifacts" \
            ./packaging/build-zip.sh x86_64-pc-windows-gnu
          (cd ci-artifacts && sha256sum --strict -c \
            invenqor-agent-windows-x86_64.zip.sha256)
      - name: Publish the Windows release ZIP for native E2E
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: invenqor-agent-windows-package
          path: |
            ci-artifacts/invenqor-agent-windows-x86_64.zip
            ci-artifacts/invenqor-agent-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 1

  linux-e2e:
    # These scripts existed and were never run by CI. Between them they cover a
    # PostgreSQL-backed server, automatic agent registration, a packaged RHEL 8
    # agent under systemd, the update path, RBAC, Keycloak, diagnostics and the
    # web console - none of which the unit suites reach.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # This one cross-builds the musl agent it then installs.
          - script: e2e-client-server.sh
            needs_rust: true
          - script: e2e-admin-settings.sh
            needs_rust: false
          # Two server instances sharing PostgreSQL and a state directory: the
          # shape in which a replica that cannot read the sealed Keycloak client
          # secret makes the login button disappear.
          - script: e2e-multipod.sh
            needs_rust: false
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        if: matrix.needs_rust
      - uses: Swatinem/rust-cache@v2
        if: matrix.needs_rust
      - name: Install cross
        if: matrix.needs_rust
        run: cargo install cross --locked --version 0.2.5
      - name: Run ${{ matrix.script }}
        run: ./scripts/${{ matrix.script }}

  windows-native-e2e:
    needs: static-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Download and verify the exact Windows release ZIP
        uses: actions/download-artifact@v8
        with:
          name: invenqor-agent-windows-package
          path: target/release-package
      - name: Verify and extract the Windows release ZIP
        shell: pwsh
        run: |
          $zip = Resolve-Path 'target/release-package/invenqor-agent-windows-x86_64.zip'
          $sidecar = Get-Content 'target/release-package/invenqor-agent-windows-x86_64.zip.sha256' -Raw
          $expected = ($sidecar.Trim() -split '\s+')[0].ToUpperInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "Windows release ZIP checksum mismatch" }
          Expand-Archive -LiteralPath $zip -DestinationPath 'target/release-package/extracted'
      - name: Verify the packaged release binary starts on native Windows
        run: ./target/release-package/extracted/invenqor-agent-windows-x86_64/bin/invenqor-agent.exe --version
        shell: pwsh
      - run: go build -o invenqor-server.exe ./cmd/invenqor-server
        working-directory: server
      - run: ./scripts/e2e-windows.ps1 -AgentPackageRoot ./target/release-package/extracted/invenqor-agent-windows-x86_64
        shell: pwsh
