name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Verify the checked-in Server UI matches the React build
        run: git diff --exit-code -- server/internal/webui/dist
      - name: Verify release PDFs contain no local build links
        run: |
          if grep -a -l '/URI (file://' docs/*.pdf; then
            echo 'A release PDF contains a local file:// link.' >&2
            exit 1
          fi
      - run: go test ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server
      - run: go build ./cmd/invenqor-server
        working-directory: server

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  static-build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            cpu: x86-64
            artifact: invenqor-agent
          - target: aarch64-unknown-linux-musl
            cpu: generic
            artifact: invenqor-agent
          - target: x86_64-pc-windows-gnu
            cpu: x86-64
            artifact: invenqor-agent.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: houseabsolute/actions-rust-cross@v1
        env:
          RUSTFLAGS: -C target-cpu=${{ matrix.cpu }}
        with:
          command: build
          target: ${{ matrix.target }}
          args: --locked --release
      - run: file target/${{ matrix.target }}/release/${{ matrix.artifact }}
      - name: Publish the Windows GNU release binary for native E2E
        if: matrix.target == 'x86_64-pc-windows-gnu'
        uses: actions/upload-artifact@v4
        with:
          name: invenqor-agent-windows-gnu
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 1

  windows-native-e2e:
    needs: static-build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-targets
      - name: Download the exact GNU binary shipped in the Windows release ZIP
        uses: actions/download-artifact@v4
        with:
          name: invenqor-agent-windows-gnu
          path: target/release
      - name: Verify the release binary starts on native Windows
        run: ./target/release/invenqor-agent.exe --version
        shell: pwsh
      - run: go build -o invenqor-server.exe ./cmd/invenqor-server
        working-directory: server
      - run: ./scripts/e2e-windows.ps1
        shell: pwsh
