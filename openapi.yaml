                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        relation_type: {type: string}
                        derivation: {type: string, enum: [same_agent_inventory, machine_identity]}
                        confidence: {type: number}
                        created_at: {type: string}
                        source: {type: object, properties: {id: {type: string}, name: {type: string}, type: {type: string}, environment: {type: string}}}
