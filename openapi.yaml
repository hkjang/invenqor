openapi: 3.1.0
info:
  title: Invenqor Server API
  version: 0.2.15
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers: [{url: /}]
paths:
  /:
    get:
      operationId: getManagementConsole
      summary: Serve the embedded management console
      security: []
      responses:
        "200":
          description: Management console HTML
          content: {text/html: {schema: {type: string}}}
        "4XX": {description: Invalid request}
  /health/live:
    get:
      operationId: getLiveness
      summary: Confirm that the Server process can answer HTTP
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties: {status: {type: string, const: UP}}
        "4XX": {description: Invalid request}
  /health/database:
    get:
      operationId: getDatabaseHealth
      summary: Inspect the active database connection and startup fallback
      description: Requires an authenticated session with `settings.read`.
      security: [{session: []}]
      responses:
        "200":
          description: Database is reachable
          content:
            application/json:
              schema:
                type: object
                required: [status, mode, opened_at]
                properties:
                  status: {type: string, const: UP}
                  mode: {type: string}
                  opened_at: {type: string, format: date-time}
                  postgres_startup_failure: {type: object, additionalProperties: true}
        "401": {description: Authentication required}
        "403": {description: Missing `settings.read` permission}
        "503": {description: Database is not reachable}
  /api/v1/system/info:
    get:
      operationId: getPublicSystemInfo
      summary: Read the product and Server version shown before login
      description: Deliberately excludes database, bind-address, and enrollment details.
      security: []
      responses:
        "200":
          description: Public version information
          content:
            application/json:
              schema: {$ref: "#/components/schemas/PublicSystemInfo"}
        "4XX": {description: Invalid request}
  /api/v1/admin/system/info:
    get:
      operationId: getAdminSystemInfo
      summary: Read authenticated Server, database, and enrollment runtime details
      description: Requires `settings.read`; values describe the Server Pod that answered the request.
      security: [{session: []}]
      responses:
        "200":
          description: Runtime details used by the administrative system panel
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminSystemInfo"}
        "401": {description: Authentication required}
        "403": {description: Missing `settings.read` permission}
  /api/v1/bootstrap/status:
    get:
      operationId: getBootstrapStatus
      summary: Report whether the one-time initial administrator is still required
      description: The token itself is never returned; `token_file` is present only on the Pod that owns it.
      security: []
      responses:
        "200":
          description: Initial setup state
          content:
            application/json:
              schema:
                type: object
                required: [required]
                properties:
                  required: {type: boolean}
                  token_file: {type: string}
        "500": {description: Bootstrap state could not be loaded}
  /api/v1/bootstrap/admin:
    post:
      operationId: createInitialAdministrator
      summary: Consume the one-time bootstrap token and create the first super administrator
      security: [{bootstrapToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, format: password, writeOnly: true}
                display_name: {type: string}
                email: {type: string, format: email}
      responses:
        "201":
          description: Initial administrator created and bootstrap claim consumed
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties: {user: {$ref: "#/components/schemas/User"}}
        "400": {description: Administrator data fails policy}
        "401": {description: Bootstrap token is invalid}
        "409": {description: Initial setup is already complete}
  /api/v1/auth/local/login:
    post:
      operationId: loginLocalUser
      summary: Authenticate a local user and issue session and CSRF cookies
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password, writeOnly: true}
                totp_code: {type: string, writeOnly: true, description: Authenticator or one-time recovery code when MFA is enabled.}
      responses:
        "200":
          description: Authenticated; session cookies and the double-submit token are issued
          content:
            application/json:
              schema:
                type: object
                required: [user, csrf_token, idle_expires_at, absolute_expires_at]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  csrf_token: {type: string, writeOnly: true}
                  idle_expires_at: {type: string, format: date-time}
                  absolute_expires_at: {type: string, format: date-time}
        "400": {description: Invalid JSON request}
        "401": {description: "Invalid credentials, missing MFA, or invalid MFA"}
        "403": {description: Account inactive}
        "423": {description: Account temporarily locked or source rate-limited}
  /api/v1/auth/methods:
    get:
      operationId: getAuthenticationMethods
      summary: Report login methods that are ready for use
      security: []
      responses:
        "200":
          description: Local and Keycloak readiness
          content:
            application/json:
              schema:
                type: object
                required: [local, keycloak, keycloak_enabled, keycloak_client_secret, keycloak_incomplete, keycloak_provider_issuer]
                properties:
                  local: {type: boolean, const: true}
                  keycloak: {type: boolean}
                  keycloak_enabled: {type: boolean}
                  keycloak_client_secret: {type: boolean}
                  keycloak_incomplete: {type: boolean}
                  keycloak_provider_issuer: {type: string}
        "500": {description: Authentication settings unavailable}
  /api/v1/auth/keycloak/start:
    get:
      operationId: startKeycloakLogin
      summary: Start an OIDC authorization-code flow and redirect to Keycloak
      security: []
      parameters:
        - in: query
          name: return_to
          schema: {type: string, default: /}
          description: Safe same-origin path used after a successful callback; unsafe values become `/`.
      responses:
        "302": {description: "Redirect to Keycloak, or back to the console with a stable `auth_error` code"}
        "4XX": {description: Invalid request}
  /api/v1/auth/keycloak/callback:
    get:
      operationId: completeKeycloakLogin
      summary: Verify the Keycloak callback, synchronize the user, and issue a session
      security: []
      parameters:
        - {in: query, name: state, schema: {type: string}, description: OIDC state for a successful provider response}
        - {in: query, name: code, schema: {type: string}, description: Authorization code for a successful provider response}
        - {in: query, name: error, schema: {type: string}, description: Provider error instead of `code`}
        - {in: query, name: error_description, schema: {type: string}}
      responses:
        "302": {description: "Redirect to the requested console path on success, or to the login screen with `auth_error` on failure"}
        "4XX": {description: Invalid request}
  /api/v1/auth/me:
    get:
      operationId: getCurrentSession
      summary: Read the current user, expiry, permissions, and account-security posture
      security: [{session: []}]
      responses:
        "200":
          description: Current authenticated principal
          content:
            application/json:
              schema:
                type: object
                required: [user, idle_expires_at, absolute_expires_at, security]
                properties:
                  user: {$ref: "#/components/schemas/User"}
                  idle_expires_at: {type: string, format: date-time}
                  absolute_expires_at: {type: string, format: date-time}
                  security: {$ref: "#/components/schemas/AccountSecurity"}
        "401": {description: Authentication required or session expired}
  /api/v1/auth/logout:
    post:
      operationId: logoutCurrentSession
      summary: Revoke the current session and clear its cookies
      description: Returns a Keycloak end-session URL only for a linked OIDC identity.
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                type: object
                required: [logged_out, logout_url]
                properties:
                  logged_out: {type: boolean, const: true}
                  logout_url: {type: string}
        "401": {description: Authentication required}
        "403": {description: CSRF token invalid}
  /api/v1/auth/password/change:
    post:
      operationId: changeCurrentPassword
      summary: Change the current local password and revoke the user's other sessions
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: {type: string, format: password, writeOnly: true}
                new_password: {type: string, format: password, writeOnly: true}
      responses:
        "200": {description: Password changed}
        "400": {description: Password is unchanged or does not satisfy policy}
        "401": {description: Current password invalid or authentication required}
        "403": {description: CSRF token invalid}
        "409": {description: Federated account has no local password}
  /api/v1/auth/totp/setup:
    post:
      operationId: setupCurrentUserTotp
      summary: Generate an unverified TOTP secret and one-time recovery codes
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      responses:
        "200":
          description: Secret, provisioning URI, and recovery codes shown once
          content:
            application/json:
              schema:
                type: object
                required: [secret, provisioning_uri, recovery_codes]
                properties:
                  secret: {type: string, writeOnly: true}
                  provisioning_uri: {type: string, format: uri, writeOnly: true}
                  recovery_codes: {type: array, writeOnly: true, items: {type: string}}
        "401": {description: Authentication required}
        "403": {description: CSRF token invalid}
        "409": {description: TOTP already enabled}
  /api/v1/auth/totp/enable:
    post:
      operationId: enableCurrentUserTotp
      summary: Verify the pending TOTP secret and enable MFA
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, writeOnly: true}}
      responses:
        "200": {description: TOTP enabled}
        "400": {description: Code invalid or setup not started}
        "401": {description: Authentication required}
        "403": {description: CSRF token invalid}
  /api/v1/auth/totp:
    delete:
      operationId: disableCurrentUserTotp
      summary: Verify an authenticator code and disable MFA
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, writeOnly: true}}
      responses:
        "200": {description: TOTP disabled and recovery codes invalidated}
        "400": {description: Authenticator code invalid}
        "401": {description: Authentication required}
        "403": {description: CSRF token invalid}
  /health/ready:
    get:
      operationId: getReadiness
      summary: Readiness and database mode
      security: []
      responses: {"200": {description: Ready}, "503": {description: Not ready}, "4XX": {description: Invalid request}}
  /v1/agent/events:
    post:
      operationId: ingestAgentEvent
      summary: Receive the unchanged Invenqor Agent envelope
      security: [{agentBearer: []}, {agentMTLS: []}]
      parameters:
        - {in: header, name: X-Invenqor-Agent-Id, required: true, schema: {type: string, format: uuid}}
        - {in: header, name: X-Invenqor-Event-Id, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Envelope"}
      responses:
        "200": {description: Persisted}
        "202": {description: Durably spooled during PostgreSQL degradation}
        "400": {description: Invalid event}
        "401": {description: Invalid credential}
  /v1/agent/preflight:
    get:
      operationId: agentRegistrationPreflight
      summary: Report whether this caller could register, without changing state
      description: Answers the registration question before any state exists, so a failed rollout can be diagnosed from the Agent host or from curl. It creates no Agent, consumes no claim and never invalidates a credential. An optional device credential is validated and reported. Every call is recorded in the shared diagnostics log as AGENT_PREFLIGHT_READY or AGENT_PREFLIGHT_BLOCKED, which is what makes an Agent that never registered visible in the console.
      security: [{}, {agentEnrollment: []}, {agentBearer: []}, {agentMTLS: []}]
      parameters:
        - {in: header, name: X-Invenqor-Agent-Id, required: false, schema: {type: string, format: uuid}}
      responses:
        "200":
          description: Registration decision for this source address
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
            X-Request-Id: {schema: {type: string}}
          content:
            application/json:
              schema:
                type: object
                required: [observed_source_ip, enrollment, credential]
                properties:
                  request_id: {type: string}
                  server_version: {type: string}
                  instance_id: {type: string}
                  database_mode: {type: string}
                  observed_source_ip: {type: string, description: Source address after trusted proxy resolution}
                  enrollment:
                    type: object
                    properties:
                      enabled: {type: boolean}
                      mode: {type: string, enum: [disabled, open, token]}
                      token_required: {type: boolean}
                      token_presented: {type: boolean}
                      network_mode: {type: string, enum: [any, allowlist]}
                      network_allowed: {type: boolean}
                      policy_version: {type: integer}
                      would_enroll: {type: boolean}
                      reason:
                        type: string
                        description: AGENT_ENROLLMENT_READY, or the same code the enrollment endpoint would return
                      detail: {type: string}
                  credential:
                    type: object
                    properties:
                      presented: {type: boolean}
                      state: {type: string, enum: [absent, valid, invalid, blocked, unavailable]}
                      agent_id: {type: string, format: uuid}
                      hostname: {type: string}
                      auth_method: {type: string}
                      status: {type: string}
                  endpoints: {type: object, additionalProperties: {type: string}}
        "400": {description: The source address could not be verified}
        "429": {description: Enrollment rate limit exceeded}
        "503": {description: The enrollment policy could not be loaded}
  /v1/agent/enroll:
    post:
      operationId: autoEnrollAgent
      summary: Automatically issue a device bearer token
      description: URL-only enrollment is enabled by default. A deployment can require the optional fleet enrollment credential or disable enrollment. The Agent persists a device-local claim and can safely retry or recover a lost device token. The plaintext device token is returned only in this response.
      security: [{}, {agentEnrollment: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, hostname, claim_token]
              properties:
                agent_id: {type: string, format: uuid}
                hostname: {type: string, maxLength: 255}
                claim_token: {type: string, pattern: "^ivq_ec_"}
      responses:
        "201":
          description: Automatically enrolled Agent and one-time device bearer token
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
        "401": {description: Invalid fleet enrollment credential when token protection is enabled}
        "403": {description: Automatic enrollment disabled or Agent blocked}
        "409": {description: Agent UUID is bound to another device claim}
        "429": {description: Enrollment rate limit exceeded}
  /v1/agent/updates:
    get:
      operationId: getAgentUpdateManifest
      summary: Select a newer signed update for this agent and rollout bucket
      description: >-
        Normal dual-signature upgrades are available to legacy Agents. A v2
        rollback is returned only when current_version is 0.2.15 or newer;
        artifact-only v1 rollbacks are never returned because their rollback
        flag is not authenticated.
      security: [{agentBearer: []}, {agentMTLS: []}]
      parameters:
        - {in: query, name: agent_id, required: true, schema: {type: string, format: uuid}}
        - {in: query, name: current_version, required: true, schema: {type: string}}
        - {in: query, name: channel, required: true, schema: {type: string, enum: [stable, beta]}}
        - {in: query, name: os, required: true, schema: {type: string, enum: [linux, windows]}}
        - {in: query, name: arch, required: true, schema: {type: string, enum: [x86_64, aarch64]}}
      responses:
        "200":
          description: Signed update manifest
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateManifest"}
        "204": {description: No newer update assigned}
        "401": {description: Invalid agent credential}
  /v1/agent/updates/{artifact}/artifact:
    get:
      operationId: downloadAgentUpdate
      summary: Download an authenticated update artifact
      security: [{agentBearer: []}, {agentMTLS: []}]
      parameters:
        - {in: path, name: artifact, required: true, schema: {type: string}}
      responses:
        "200": {description: Agent binary}
        "401": {description: Invalid agent credential}
        "404": {description: Artifact not found}
  /api/v1/admin/agents:
    get:
      operationId: listAgents
      summary: List the registered Agent fleet and its collection posture
      description: Requires `agents.read`; credential secret material is never returned.
      security: [{session: []}]
      responses:
        "200":
          description: Registered Agents ordered by hostname and device ID
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents: {type: array, items: {$ref: "#/components/schemas/Agent"}}
        "401": {description: Authentication required}
        "403": {description: Missing `agents.read` permission}
    post:
      operationId: provisionAgentCredential
      summary: Pre-provision an Agent and return a one-time device bearer token
      description: Requires `agents.manage` and CSRF validation. Only the token digest is retained.
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: {type: string, format: uuid}
                hostname: {type: string, maxLength: 255}
      responses:
        "201":
          description: Provisioned Agent and one-time token
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content:
            application/json:
              schema:
                type: object
                required: [agent, token]
                properties:
                  agent: {$ref: "#/components/schemas/Agent"}
                  token: {type: string, writeOnly: true, pattern: "^ivq_at_"}
        "400": {description: Invalid Agent UUID or request}
        "401": {description: Authentication required}
        "403": {description: Missing `agents.manage` permission or invalid CSRF token}
  /api/v1/admin/agents/{agentId}/tokens/rotate:
    post:
      operationId: rotateAgentCredential
      summary: Rotate an Agent bearer token with an optional overlap window
      description: Requires `agents.manage`; the replacement token is returned once.
      security: [{session: []}]
      parameters:
        - {$ref: "#/components/parameters/AgentId"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grace_seconds]
              properties:
                grace_seconds: {type: integer, minimum: 0, maximum: 604800}
      responses:
        "200":
          description: One-time replacement token
          headers: {Cache-Control: {schema: {type: string, const: no-store}}}
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties: {token: {type: string, writeOnly: true, pattern: "^ivq_at_"}}
        "400": {description: Grace period outside zero to seven days}
        "403": {description: Missing `agents.manage` permission or invalid CSRF token}
        "404": {description: Agent not found}
  /api/v1/admin/agents/{agentId}/block:
    post:
      operationId: blockAgent
      summary: Block an Agent and revoke its ability to authenticate
      description: Requires `agents.manage` and CSRF validation.
      security: [{session: []}]
      parameters:
        - {$ref: "#/components/parameters/AgentId"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200":
          description: Agent blocked
          content:
            application/json:
              schema: {type: object, required: [blocked], properties: {blocked: {type: boolean, const: true}}}
        "403": {description: Missing `agents.manage` permission or invalid CSRF token}
        "404": {description: Agent not found}
  /api/v1/admin/agents/{agentId}/unblock:
    post:
      operationId: unblockAgent
      summary: Allow a blocked Agent to authenticate again
      description: Requires `agents.manage` and CSRF validation.
      security: [{session: []}]
      parameters:
        - {$ref: "#/components/parameters/AgentId"}
        - {$ref: "#/components/parameters/CSRFToken"}
      responses:
        "200":
          description: Agent unblocked
          content:
            application/json:
              schema: {type: object, required: [blocked], properties: {blocked: {type: boolean, const: false}}}
        "403": {description: Missing `agents.manage` permission or invalid CSRF token}
        "404": {description: Agent not found}
  /api/v1/admin/agents/{agentId}/certificates:
    post:
      operationId: registerAgentCertificate
      summary: Register an mTLS certificate fingerprint for an Agent
      description: Requires `agents.manage` and CSRF validation.
      security: [{session: []}]
      parameters:
        - {$ref: "#/components/parameters/AgentId"}
        - {$ref: "#/components/parameters/CSRFToken"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fingerprint]
              properties:
                fingerprint: {type: string, description: SHA-256 certificate fingerprint in hexadecimal form.}
                expires_at: {type: string, format: date-time}
      responses:
        "201": {description: Certificate fingerprint registered}
        "400": {description: "Invalid fingerprint, expiry, or Agent"}
        "403": {description: Missing `agents.manage` permission or invalid CSRF token}
  /api/v1/admin/api-key-scopes:
    get:
      operationId: listApiKeyScopes
      summary: List the scope catalog available to API and MCP keys
      description: Requires `api_keys.manage`; scope escalation is still checked when a key is created or changed.
      security: [{session: []}]
      responses:
        "200":
          description: Supported scope names and descriptions
          content:
            application/json:
              schema:
                type: object
                required: [scopes]
                properties:
                  scopes:
                    type: array
                    items:
                      type: object
                      required: [name, description]
                      properties:
                        name: {$ref: "#/components/schemas/ApiKeyScope"}
                        description: {type: string}
        "401": {description: Authentication required}
        "403": {description: Missing `api_keys.manage` permission}
  /api/v1/admin/settings:
    get:
      operationId: listRuntimeSettings
      summary: List generic runtime settings with secrets masked
      description: Requires `settings.read`. Dedicated Keycloak records are excluded.
      security: [{session: []}]
      responses:
        "200":
          description: Settings and supported category names
          content:
            application/json:
              schema:
                type: object
                required: [items, categories]
                properties:
                  items: {type: array, items: {$ref: "#/components/schemas/Setting"}}
                  categories: {type: array, items: {type: string}}
        "401": {description: Authentication required}
        "403": {description: Missing `settings.read` permission}
    patch:
      operationId: updateRuntimeSettings
      summary: Atomically create or update generic runtime settings
      description: Requires `settings.write` and CSRF validation. Secret values are encrypted before storage; dedicated Keycloak records are rejected.
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [key, value]
                    properties:
                      key: {type: string, maxLength: 128, pattern: "^[a-z0-9._-]+$"}
                      value: {description: Any valid JSON value.}
                      secret: {type: boolean, default: false}
                      apply_mode: {type: string, enum: [immediate, restart, migration], default: immediate}
                      reason: {type: string}
      responses:
        "200": {description: All settings committed}
        "400": {description: "Empty update, invalid key, value, or apply mode"}
        "403": {description: Missing `settings.write` permission or invalid CSRF token}
        "409": {description: A dedicated setting endpoint must be used}
        "503": {description: Secret storage unavailable}
  /api/v1/admin/settings/history:
    get:
      operationId: listRuntimeSettingHistory
      summary: Read up to 500 generic setting versions, with secret values masked
      description: Requires `settings.read`; dedicated Keycloak settings are excluded.
      security: [{session: []}]
      parameters:
        - {in: query, name: key, schema: {type: string}, description: Limit history to one exact setting key.}
      responses:
        "200":
          description: Setting versions newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties: {items: {type: array, items: {$ref: "#/components/schemas/SettingVersion"}}}
        "401": {description: Authentication required}
        "403": {description: Missing `settings.read` permission}
  /api/v1/admin/settings/rollback:
    post:
      operationId: rollbackRuntimeSetting
      summary: Restore a generic setting to a selected historical value
      description: Requires `settings.write` and CSRF validation; the rollback creates a new version.
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, version]
              properties:
                key: {type: string}
                version: {type: integer, minimum: 1}
                reason: {type: string}
      responses:
        "200": {description: Historical value restored as a new version}
        "400": {description: Key or version missing}
        "403": {description: Missing `settings.write` permission or invalid CSRF token}
        "404": {description: Setting version not found}
        "409": {description: A dedicated setting endpoint must be used}
  /api/v1/admin/agent-updates:
    get:
      operationId: listAgentUpdates
      summary: List published releases with their rollout and adoption
      description: Requires agents.read. Reports each release's rollout percent, how many agents already report that version, how many the rollout can reach, and whether this server was able to verify the signature at publish time.
      security: [{session: []}]
      responses:
        "200":
          description: Releases, fleet version distribution and verification capability
          content:
            application/json:
              schema:
                type: object
                required: [releases, agent_versions, agents, signature_verified]
                properties:
                  releases:
                    type: array
                    items:
                      type: object
                      properties:
                        base: {type: string, description: Release identifier used by the rollout and delete endpoints}
                        version: {type: string}
                        channel: {type: string, enum: [stable, beta]}
                        os: {type: string, enum: [linux, windows]}
                        architecture: {type: string, enum: [x86_64, aarch64]}
                        rollout_percent: {type: integer, minimum: 0, maximum: 100}
                        allow_downgrade: {type: boolean, description: "A deliberate rollback release, which agents accept even though it is older"}
                        notes: {type: string}
                        signature_verified: {type: boolean, description: Whether the server checked the signature when it was published}
                        signature_scheme: {type: string, const: ed25519}
                        signature_version: {type: integer, enum: [1, 2], description: "1 is a stored legacy artifact-only release; all new publications are metadata-bound v2"}
                        published_at: {type: string, format: date-time}
                        published_by: {type: string}
                        sha256: {type: string}
                        size: {type: integer}
                        adopted_agents: {type: integer}
                        eligible_agents: {type: integer}
                  agent_versions:
                    type: array
                    items:
                      type: object
                      properties:
                        label: {type: string}
                        count: {type: integer}
                  agents: {type: integer}
                  signature_verified: {type: boolean, description: Whether a signing public key is configured on this server}
        "401": {description: Authentication required}
        "403": {description: agents.read permission required}
    post:
      operationId: publishAgentUpdate
      summary: Publish an administrator-approved signed agent update
      description: >-
        Requires agents.manage and the X-CSRF-Token header. New publications
        require two Ed25519 signatures: signature authenticates artifact bytes
        for pre-v2 Agent bridge compatibility, and manifest_signature protects
        version, channel, OS, architecture, exact size, SHA-256, and
        allow_downgrade. Prefer the offline helper's single signature_bundle_file;
        direct Base64 values or raw signature files are also supported.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [artifact, rollout_percent]
              properties:
                artifact: {type: string, format: binary}
                signature_bundle_file: {type: string, format: binary, description: JSON emitted by sign-agent-update-manifest-v2.py; supplies metadata and both signatures}
                version: {type: string, example: 0.2.3, description: Required without signature_bundle_file; when both are supplied they must match}
                channel: {type: string, enum: [stable, beta], description: Required without signature_bundle_file}
                os: {type: string, enum: [linux, windows], description: Required without signature_bundle_file}
                architecture: {type: string, enum: [x86_64, aarch64], description: Required without signature_bundle_file}
                signature: {type: string, description: Base64 artifact-only Ed25519 bridge signature; required with direct fields when signature_file is absent}
                signature_file: {type: string, format: binary, description: Raw 64-byte artifact-only bridge signature}
                manifest_signature: {type: string, description: Base64 Ed25519 canonical manifest-v2 signature; required with direct fields when manifest_signature_file is absent}
                manifest_signature_file: {type: string, format: binary, description: Raw 64-byte canonical manifest-v2 signature}
                allow_downgrade: {type: boolean, default: false, description: Must match the value protected by the v2 signature}
                notes: {type: string}
                rollout_percent: {type: integer, minimum: 0, maximum: 100}
      responses:
        "201":
          description: Published manifest
          content:
            application/json:
              schema: {$ref: "#/components/schemas/UpdateManifest"}
        "400": {description: "Invalid metadata, signature encoding, or artifact"}
        "503": {description: "Update signing public key or update store is unavailable"}
  /api/v1/admin/agent-updates/{release}:
    patch:
      operationId: setAgentUpdateRollout
      summary: Widen or halt a release without re-uploading it
      description: >-
        Requires agents.manage and the X-CSRF-Token header. Setting
        rollout_percent to 0 is the emergency stop; no agent is offered the
        release again, and nothing is deleted. Recorded in the audit log as
        agent_update.halt.
      security: [{session: []}]
      parameters:
        - {in: path, name: release, required: true, schema: {type: string}, description: "The release base identifier, for example 0.2.7-linux-x86_64"}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rollout_percent]
              properties:
                rollout_percent: {type: integer, minimum: 0, maximum: 100}
                reason: {type: string}
      responses:
        "200": {description: Rollout updated}
        "400": {description: The rollout percent is out of range}
        "404": {description: The release does not exist}
    delete:
      operationId: retireAgentUpdate
      summary: Delete a published release and its artifact
      description: Requires agents.manage and the X-CSRF-Token header. Halting with rollout_percent 0 is the reversible action; this is the cleanup that follows.
      security: [{session: []}]
      parameters:
        - {in: path, name: release, required: true, schema: {type: string}}
      responses:
        "204": {description: Retired}
        "404": {description: The release does not exist}
  /api/v1/admin/api-keys:
    get:
      operationId: listApiKeys
      summary: List API key metadata without secret material
      security: [{session: []}]
      responses:
        "200": {description: API key list}
        "401": {description: Authentication required}
    post:
      operationId: createApiKey
      summary: Create a scoped API key; secret is returned once
      description: Requires api_keys.manage and X-CSRF-Token.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scopes]
              properties:
                name: {type: string, maxLength: 120}
                scopes: {type: array, items: {$ref: "#/components/schemas/ApiKeyScope"}}
                expires_at: {type: string, format: date-time}
      responses:
        "201": {description: API key and one-time secret}
        "400": {description: "Invalid name, scope, or expiry"}
        "403": {description: Scope escalation rejected}
  /api/v1/admin/api-keys/{keyId}:
    get:
      operationId: getApiKey
      summary: Get API key metadata
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/KeyId"}]
      responses:
        "200": {description: API key metadata}
        "404": {description: API key not found}
    patch:
      operationId: updateApiKey
      summary: Rename an API key or replace all scopes
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/KeyId"}]
      responses:
        "200": {description: Updated}
        "400": {description: Invalid input}
        "409": {description: Concurrent scope update conflict; reload the key and retry}
    delete:
      operationId: revokeApiKey
      summary: Immediately revoke current and grace API key secrets
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/KeyId"}]
      responses:
        "204": {description: Revoked}
        "404": {description: API key not found}
  /api/v1/admin/api-keys/{keyId}/rotate:
    post:
      operationId: rotateApiKey
      summary: Rotate a key and optionally keep the old secret during grace
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/KeyId"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grace_seconds]
              properties:
                grace_seconds: {type: integer, minimum: 0, maximum: 604800}
      responses:
        "200": {description: Updated key and one-time new secret}
        "400": {description: Invalid grace period}
        "409": {description: Concurrent key rotation conflict; reload the key and retry}
  /api/v1/admin/api-keys/{keyId}/scopes:
    post:
      operationId: addApiKeyScopes
      summary: Add scopes to an API key
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/KeyId"}]
      responses:
        "200": {description: Scopes added}
        "400": {description: Invalid scopes}
        "409": {description: Concurrent key update conflict; reload the key and retry}
  /api/v1/admin/api-keys/{keyId}/scopes/{scope}:
    delete:
      operationId: removeApiKeyScope
      summary: Remove one scope from an API key
      security: [{session: []}]
      parameters:
        - {$ref: "#/components/parameters/KeyId"}
        - {in: path, name: scope, required: true, schema: {$ref: "#/components/schemas/ApiKeyScope"}}
      responses:
        "200": {description: Scope removed}
        "404": {description: Key or scope not found}
        "409": {description: Concurrent scope update conflict; reload the key and retry}
  /api/v1/admin/settings/postgresql:
    get:
      operationId: getPostgresqlSettings
      summary: Read safe PostgreSQL status without DSN credentials
      security: [{session: []}]
      responses:
        "200": {description: Effective and saved connection summaries}
        "401": {description: Authentication required}
    patch:
      operationId: updatePostgresqlSettings
      summary: Test and encrypt a PostgreSQL DSN for restart-time application
      description: Requires settings.write and X-CSRF-Token. Environment variables take precedence.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dsn]
              properties:
                dsn: {type: string, format: password, writeOnly: true}
                reason: {type: string}
      responses:
        "200": {description: Connection tested and encrypted setting saved}
        "400": {description: Invalid DSN}
        "502": {description: PostgreSQL connection failed}
  /api/v1/admin/settings/postgresql/test:
    post:
      operationId: testPostgresqlSettings
      summary: Test a PostgreSQL DSN without saving or migrating
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dsn]
              properties:
                dsn: {type: string, format: password, writeOnly: true}
      responses:
        "200": {description: Connection succeeded}
        "400": {description: Invalid DSN}
        "502": {description: Connection failed without credential disclosure}
  /api/v1/admin/settings/agent-enrollment:
    get:
      operationId: getAgentEnrollmentSettings
      summary: Read the database-backed Agent auto-enrollment policy
      description: Requires settings.read. The registration token or its digest is never returned.
      security: [{session: []}]
      responses:
        "200":
          description: Current policy shared by all Server pods
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentEnrollmentPolicy"}
        "401": {description: Authentication required}
    patch:
      operationId: updateAgentEnrollmentSettings
      summary: Enable URL-only or token-protected enrollment, or disable enrollment
      description: Requires settings.write and X-CSRF-Token. Changes are persisted in the common database and take effect on every Server pod without restart.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: {type: string, enum: [disabled, open, token]}
                network_mode: {type: string, enum: [any, allowlist], default: any}
                allowed_networks:
                  type: array
                  maxItems: 256
                  items: {type: string, description: Exact IPv4/IPv6 address or CIDR}
                trusted_proxies:
                  type: array
                  maxItems: 64
                  items: {type: string, description: Exact ingress/LB IP or CIDR}
                reason: {type: string}
      responses:
        "200":
          description: Policy applied immediately
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentEnrollmentPolicy"}
        "400": {description: Invalid mode}
        "409": {description: "Protected mode selected before a token was issued, or concurrent update conflict"}
  /api/v1/admin/settings/agent-enrollment/token:
    post:
      operationId: issueAgentEnrollmentToken
      summary: Issue or rotate the registration token and enable protected enrollment
      description: Requires settings.write and X-CSRF-Token. The plaintext is returned once, is never stored, and replaces any previous registration token immediately.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "201":
          description: Token issued and protected mode applied
          headers:
            Cache-Control: {schema: {type: string, const: no-store}}
          content:
            application/json:
              schema:
                allOf:
                  - {$ref: "#/components/schemas/AgentEnrollmentPolicy"}
                  - type: object
                    required: [registration_token, shown_once]
                    properties:
                      registration_token: {type: string, writeOnly: true, pattern: "^ivq_et_"}
                      shown_once: {type: boolean, const: true}
        "4XX": {description: "Invalid request, authentication failure, or permission denied"}
    delete:
      operationId: deleteAgentEnrollmentToken
      summary: Delete the registration token
      description: Requires settings.write and X-CSRF-Token. If automatic enrollment is active, it becomes URL-only open enrollment.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: {type: string}
      responses:
        "200":
          description: Token deleted
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AgentEnrollmentPolicy"}
        "4XX": {description: "Invalid request, authentication failure, or permission denied"}
  /api/v1/admin/settings/keycloak:
    get:
      operationId: getKeycloakSettings
      summary: Read OIDC settings and Client Secret configured state
      security: [{session: []}]
      responses:
        "200":
          description: Keycloak settings; secret value is never returned
        "401": {description: Authentication required}
    patch:
      operationId: updateKeycloakSettings
      summary: Validate and save Keycloak OIDC settings
      description: Requires settings.write and X-CSRF-Token. Applies to new logins.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: {$ref: "#/components/schemas/OIDCSettings"}
                client_secret: {type: string, format: password, writeOnly: true}
                reason: {type: string}
      responses:
        "200": {description: Saved}
        "400": {description: "Invalid setting, missing secret, or unknown mapped role"}
  /api/v1/admin/settings/keycloak/test:
    post:
      operationId: testKeycloakSettings
      summary: Validate OIDC discovery and TLS/Private CA trust without saving
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [settings]
              properties:
                settings: {$ref: "#/components/schemas/OIDCSettings"}
      responses:
        "200": {description: Issuer discovery succeeded}
        "400": {description: Invalid OIDC settings}
        "502": {description: Discovery or TLS validation failed}
  /api/v1/admin/settings/keycloak/auto-configure:
    post:
      operationId: autoConfigureKeycloak
      summary: Discover, validate, save, and enable Keycloak from minimum inputs
      description: Requires settings.write and X-CSRF-Token. Derives callback/logout URIs and standard scopes/claims, validates discovery and TLS first, then saves the OIDC settings and encrypted Client Secret.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [keycloak_url, client_id, application_url]
              properties:
                keycloak_url: {type: string, format: uri}
                realm: {type: string}
                client_id: {type: string}
                client_secret: {type: string, format: password, writeOnly: true}
                application_url: {type: string, format: uri}
                private_ca_pem: {type: string, writeOnly: true}
                reason: {type: string}
      responses:
        "200": {description: Discovery succeeded and Keycloak login was enabled}
        "400": {description: Missing Client Secret or invalid role mapping}
        "502": {description: "Invalid URL, issuer discovery, or TLS trust failure"}
  /api/v1/admin/diagnostics/logs:
    get:
      operationId: listDiagnosticLogs
      summary: List bounded multi-pod Server and Agent connectivity diagnostics
      description: Requires audit.read. Warning/error and Agent enrollment diagnostics are stored in the shared database for 30 days with a 10,000-event cap. Secrets and raw inventory are not retained.
      security: [{session: []}]
      parameters:
        - {in: query, name: level, schema: {type: string, enum: [info, warning, error]}}
        - {in: query, name: component, schema: {type: string}}
        - {in: query, name: instance_id, schema: {type: string}}
        - {in: query, name: q, schema: {type: string}}
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 200}}
      responses:
        "200":
          description: Diagnostics from every Server instance sharing the database
          content:
            application/json:
              schema:
                type: object
                required: [items, instances, retention, instance_id]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/DiagnosticLog"}
                  instances: {type: array, items: {type: string}}
                  retention:
                    type: object
                    properties:
                      days: {type: integer, const: 30}
                      maximum_events: {type: integer, const: 10000}
                  instance_id: {type: string}
        "401": {description: Authentication required}
        "403": {description: audit.read permission required}
  /api/v1/admin/diagnostics/enrollment:
    get:
      operationId: getEnrollmentDiagnostics
      summary: Summarise Agent registration attempts, failures and silent Agents
      description: Requires agents.read. Aggregates the agent_enrollment, agent_transport and agent_preflight diagnostics for a time window, and lists Agents that hold a credential but never delivered inventory. Answers "which machines tried to register and what stopped them" without knowing what to search for.
      security: [{session: []}]
      parameters:
        - {in: query, name: hours, schema: {type: integer, minimum: 1, maximum: 720, default: 24}}
      responses:
        "200":
          description: Registration health for the requested window
          content:
            application/json:
              schema:
                type: object
                required: [window_hours, totals, by_event_code, sources, awaiting_inventory]
                properties:
                  generated_at: {type: string, format: date-time}
                  window_hours: {type: integer}
                  instance_id: {type: string}
                  database_mode: {type: string}
                  totals:
                    type: object
                    properties:
                      events: {type: integer}
                      succeeded: {type: integer}
                      rejected: {type: integer}
                      preflight_checks: {type: integer}
                      preflight_blocked: {type: integer}
                      transport_failed: {type: integer}
                  by_event_code:
                    type: array
                    items:
                      type: object
                      properties:
                        event_code: {type: string}
                        level: {type: string, enum: [info, warning, error]}
                        count: {type: integer}
                        message: {type: string}
                        remediation: {type: string}
                        last_occurred_at: {type: string}
                        last_request_id: {type: string}
                  sources:
                    type: array
                    description: One entry per source address and Agent identifier, failing sources first
                    items:
                      type: object
                      properties:
                        source_ip: {type: string}
                        agent_id: {type: string}
                        attempts: {type: integer}
                        failures: {type: integer}
                        last_event_code: {type: string}
                        last_level: {type: string}
                        last_message: {type: string}
                        last_request_id: {type: string}
                        last_instance_id: {type: string}
                        last_occurred_at: {type: string}
                        remediation: {type: string}
                        agent_version: {type: string}
                  awaiting_inventory:
                    type: array
                    description: Registered Agents with no inventory event yet
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        agent_id: {type: string, format: uuid}
                        hostname: {type: string}
                        status: {type: string}
                        auth_method: {type: string}
                        version: {type: string}
                        created_at: {type: string}
                        last_seen_at: {type: [string, "null"]}
                  enrollment: {type: object, description: Current registration policy as shown in Settings}
        "401": {description: Authentication required}
        "403": {description: agents.read permission required}
  /api/v1/admin/settings/classification:
    get:
      operationId: listClassificationRules
      summary: List the asset classification taxonomy with usage and coverage
      description: Requires settings.read. Rules arrive in run order (priority, then name); later rules may match on values earlier rules assigned. Each rule reports how many assets its decisions currently explain.
      security: [{session: []}]
      responses:
        "200":
          description: Ordered rule set and coverage summary
          content:
            application/json:
              schema:
                type: object
                required: [rules, summary]
                properties:
                  rules:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: string}
                        description: {type: string}
                        priority: {type: integer}
                        enabled: {type: boolean}
                        system_rule: {type: boolean}
                        confidence: {type: number}
                        assets: {type: integer, description: Assets this rule currently explains}
                        match:
                          type: object
                          properties:
                            categories: {type: array, items: {type: string}}
                            name_patterns: {type: array, items: {type: string}, description: Whole-name wildcard match}
                            name_tokens: {type: array, items: {type: string}, description: "Delimiter-separated token match, which keeps an environment code from matching inside an unrelated product name"}
                            types: {type: array, items: {type: string}}
                            environments: {type: array, items: {type: string}}
                            attribute_equals: {type: object, additionalProperties: {type: string}}
                            attribute_contains: {type: object, additionalProperties: {type: string}}
                        assign:
                          type: object
                          properties:
                            type: {type: string}
                            environment: {type: string}
                            criticality: {type: string}
                            owner_department: {type: string}
                            location: {type: string}
                            tags: {type: array, items: {type: string}}
                            relate_to_host: {type: boolean, description: Whether this component earns a relationship to the host it was collected from}
                            relation: {type: string}
                  summary:
                    type: object
                    properties:
                      assets: {type: integer}
                      classified: {type: integer}
                      manual: {type: integer}
                      unclassified: {type: integer}
                      inferred_relations: {type: integer}
                      proposed_relations: {type: integer}
        "401": {description: Authentication required}
        "403": {description: settings.read permission required}
  /api/v1/admin/settings/classification/rules/{ruleId}:
    patch:
      operationId: updateClassificationRule
      summary: Enable, disable or reprioritise one classification rule
      description: Requires settings.write and the X-CSRF-Token header. The change takes effect for the next ingested event immediately; use reclassify to apply it to assets already stored.
      security: [{session: []}]
      parameters:
        - {in: path, name: ruleId, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: {type: boolean}
                priority: {type: integer, minimum: 1, maximum: 999}
                reason: {type: string}
      responses:
        "200": {description: Rule updated}
        "400": {description: "No change requested, or the priority is out of range"}
        "404": {description: The rule does not exist}
  /api/v1/admin/settings/classification/reclassify:
    post:
      operationId: reclassifyAssets
      summary: Replay the current rule set over the stored inventory
      description: Requires settings.write. Fields an operator has set by hand are never overwritten. Returns how many assets were examined and how many the rules explained.
      security: [{session: []}]
      requestBody:
        required: false
        content:
          application/json:
            schema: {type: object, properties: {reason: {type: string}}}
      responses:
        "200":
          description: Reclassification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  examined: {type: integer}
                  classified: {type: integer}
        "403": {description: Missing settings.write permission}
  /api/v1/assets/relations/proposed:
    get:
      operationId: listProposedRelations
      summary: List inferred relationships awaiting human review
