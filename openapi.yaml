  /mcp:
    get:
      operationId: rejectMcpSseTransport
      summary: Reject legacy MCP SSE discovery on the stateless endpoint
      description: Requires `mcp.access`; clients must use Streamable HTTP POST instead of an SSE stream.
      security: [{externalBearer: []}]
      responses:
        "401": {description: Invalid API key}
        "403": {description: Missing `mcp.access` scope}
        "405":
          description: SSE is unsupported
          headers: {Allow: {schema: {type: string, const: POST}}}
    post:
      operationId: mcpStreamableHttp
      summary: Stateless MCP Streamable HTTP JSON-RPC endpoint
      description: >-
        Supports the stateless MCP 2026-07-28 lifecycle and the legacy
        2025-11-25 initialize lifecycle on one endpoint. Modern requests must
        carry matching MCP-Protocol-Version, Mcp-Method and, for tools/call,
        Mcp-Name headers plus the protocol metadata envelope. Requires
        mcp.access; tool visibility and execution are filtered by API-key
        scopes on every request.
      security: [{externalBearer: []}]
      parameters:
        - in: header
          name: MCP-Protocol-Version
          required: false
          schema: {type: string, enum: [2026-07-28, 2025-11-25]}
          description: Required as 2026-07-28 for the modern stateless lifecycle; optional during legacy initialize.
        - in: header
          name: Mcp-Method
          required: false
          schema: {type: string}
          description: Required for modern requests and must equal the JSON-RPC method.
        - in: header
          name: Mcp-Name
          required: false
          schema: {type: string}
          description: Required for modern tools/call and must equal params.name; omitted for methods without a named subject.
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        "200": {description: JSON-RPC response}
        "202": {description: Legacy notification accepted}
        "400": {description: "Invalid JSON-RPC, protocol metadata, version, or routing header contract"}
        "401": {description: Invalid API key}
        "403": {description: Missing scope or rejected Origin}
        "404": {description: RPC method is unavailable in the modern protocol lifecycle}
