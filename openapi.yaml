      description: >-
        Accepts the same filters as listAssets and writes a UTF-8 CSV with a byte
        order mark so it opens correctly in a spreadsheet.
      security: [{session: []}]
      responses:
        "200": {description: CSV inventory extract, content: {text/csv: {schema: {type: string}}}}
        "403": {description: Missing assets.export permission}
  /api/v1/admin/audit:
    get:
      operationId: listAudit
      summary: Search the audit log
      description: >-
        Every filter is applied in the query, and the response reports the total
        the filter matches together with the values present for each filterable
        column, so the console's controls cannot drift from what is recorded.
      security: [{session: []}]
      parameters:
        - {in: query, name: q, schema: {type: string}, description: "Action, actor, resource, request ID, IP or reason"}
        - {in: query, name: action, schema: {type: string}}
        - {in: query, name: actor, schema: {type: string}}
        - {in: query, name: resource_type, schema: {type: string}}
        - {in: query, name: result, schema: {type: string}}
        - in: query
          name: from
          schema: {type: string}
          description: RFC 3339 timestamp or YYYY-MM-DD. A bare date starts at midnight UTC.
        - in: query
          name: to
          schema: {type: string}
          description: RFC 3339 timestamp or YYYY-MM-DD. A bare date includes the whole day.
        - {in: query, name: limit, schema: {type: integer, minimum: 1, maximum: 500, default: 100}}
        - {in: query, name: offset, schema: {type: integer, minimum: 0}}
      responses:
        "200": {description: Audit page with total and facets}
        "400": {description: Unusable date window}
        "403": {description: Missing audit.read permission}
  /api/v1/admin/audit.csv:
    get:
      operationId: exportAudit
      summary: Download the filtered audit log as CSV
      description: Taking an extract is itself recorded as audit.export.
      security: [{session: []}]
      responses:
        "200": {description: CSV audit extract, content: {text/csv: {schema: {type: string}}}}
        "400": {description: Unusable date window}
        "403": {description: Missing audit.read permission}
  /api/v1/query/schema:
    get:
      operationId: getQueryGrammar
      summary: Describe the Query DSL fields and operators
      description: >-
        Published from the parser's own allowlist so a reference cannot describe
        a field the parser rejects.
      security: [{session: []}]
      responses:
        "200": {description: "Queryable fields, operators and limits"}
        "403": {description: Missing queries.execute permission}
  /api/v1/query/validate:
    post:
      operationId: validateQuery
      summary: Parse a Query DSL expression without executing it
      description: Requires `queries.execute`; syntactic rejection is returned as `valid:false` with HTTP 200.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueryInput"}
      responses:
        "200":
          description: Validation result and parsed AST when valid
          content:
            application/json:
              schema:
                type: object
                required: [valid]
                properties:
                  valid: {type: boolean}
                  error: {type: string}
                  ast: {type: object}
        "400": {description: Invalid JSON request}
        "401": {description: Authentication required}
        "403": {description: Missing `queries.execute` permission}
  /api/v1/auth/totp/recovery-codes:
    post:
      operationId: regenerateRecoveryCodes
      summary: Issue a new set of recovery codes
      description: >-
        Requires a current authenticator code; a recovery code is not accepted,
        so one leaked code cannot be used to mint more. The previous set stops
        working immediately.
      security: [{session: []}]
      parameters: [{$ref: "#/components/parameters/CSRFToken"}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: {code: {type: string, writeOnly: true}}
      responses:
        "200": {description: "The new codes, shown once"}
        "400": {description: The authenticator code is invalid}
        "403": {description: CSRF token invalid}
        "409": {description: The account has no enabled second factor}
  /api/v1/query/execute:
    post:
      operationId: executeQuery
      summary: Execute a validated, parameter-bound Query DSL expression
      description: Requires `queries.execute`; result size defaults to 100 and is capped at 500.
      security: [{session: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/QueryInput"}
      responses:
        "200": {description: "Matching assets, count, and parsed AST"}
        "400": {description: "Unsafe, invalid, or malformed query"}
        "401": {description: Authentication required}
        "403": {description: Missing `queries.execute` permission}
components:
  securitySchemes:
    agentBearer: {type: http, scheme: bearer}
    agentEnrollment: {type: apiKey, in: header, name: X-Invenqor-Enrollment-Token}
    agentMTLS: {type: mutualTLS}
    bootstrapToken: {type: apiKey, in: header, name: X-Invenqor-Bootstrap-Token}
    session: {type: apiKey, in: cookie, name: invenqor_session}
    externalBearer: {type: http, scheme: bearer, bearerFormat: Invenqor scoped API key}
  parameters:
    AgentId: {in: path, name: agentId, required: true, schema: {type: string, format: uuid}}
    AssetId: {in: path, name: assetId, required: true, schema: {type: string, format: uuid}}
    RelationId: {in: path, name: relationId, required: true, schema: {type: string, format: uuid}}
    CSRFToken:
      in: header
      name: X-CSRF-Token
      required: true
      description: Double-submit token from the current `invenqor_csrf` cookie.
      schema: {type: string}
    KeyId: {in: path, name: keyId, required: true, schema: {type: string, format: uuid}}
    UserId: {in: path, name: userId, required: true, schema: {type: string, format: uuid}}
  schemas:
    User:
      type: object
      required: [id, username, display_name, email, super_admin, roles, permissions]
      properties:
        id: {type: string, format: uuid}
        username: {type: string}
        display_name: {type: string}
        email: {type: string}
        super_admin: {type: boolean}
        roles: {type: array, items: {type: string}}
        permissions: {type: array, items: {type: string}}
    AccountSecurity:
      type: object
      required: [password_configured, totp_enabled, recovery_codes_remaining]
      properties:
        password_configured: {type: boolean}
        totp_enabled: {type: boolean}
        recovery_codes_remaining: {type: integer, minimum: 0}
        totp_verified_at: {type: string, format: date-time}
    Agent:
      type: object
      required: [id, agent_id, hostname, status, version, os_name, architecture, auth_method, policy_version]
      properties:
        id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        hostname: {type: string}
        status: {type: string}
        version: {type: string}
        os_name: {type: string}
        architecture: {type: string}
        auth_method: {type: string}
        policy_version: {type: string}
        last_seen_at: {type: string, format: date-time}
        last_inventory_at: {type: string, format: date-time}
    Asset:
      type: object
      required: [id, asset_key, name, type, status, criticality, environment, owner_department, location, confidence, attributes, custom_fields, source, first_seen_at, last_seen_at]
      properties:
        id: {type: string, format: uuid}
        asset_key: {type: string}
        name: {type: string}
        type: {type: string}
        status: {type: string}
        criticality: {type: string}
        environment: {type: string}
        owner_department: {type: string}
        location: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        attributes: {type: object, additionalProperties: true}
        custom_fields: {type: object, additionalProperties: true}
        source: {type: string}
        first_seen_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        deleted_at: {type: string, format: date-time}
    AssetMutation:
      type: object
      properties:
        asset_key: {type: string, description: Used only when a manual asset is created.}
        name: {type: string}
        type: {type: string, description: Required when a manual asset is created; immutable on update.}
        status: {type: string}
        criticality: {type: string}
        environment: {type: string}
        owner_department: {type: string}
        location: {type: string}
        attributes: {type: object, additionalProperties: true}
        custom_fields: {type: object, additionalProperties: true}
        reason: {type: string}
    AssetRelation:
      type: object
      required: [id, source_asset_id, relation_type, target_asset_id, valid_from, source, confidence, source_asset, target_asset]
      properties:
        id: {type: string, format: uuid}
        source_asset_id: {type: string, format: uuid}
        relation_type: {type: string}
        target_asset_id: {type: string, format: uuid}
        valid_from: {type: string, format: date-time}
        source: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        source_asset: {$ref: "#/components/schemas/RelationAssetSummary"}
        target_asset: {$ref: "#/components/schemas/RelationAssetSummary"}
    RelationAssetSummary:
      type: object
      required: [name, type]
      properties:
        name: {type: string}
        type: {type: string}
    QueryInput:
      type: object
      required: [query]
      properties:
        query: {type: string}
        limit: {type: integer, minimum: 1, maximum: 500, default: 100}
    Setting:
      type: object
      required: [key, value, secret, apply_mode, pending, version]
      properties:
        key: {type: string}
        value: {description: JSON setting value; secret values are replaced by a configured/masked marker.}
        secret: {type: boolean}
        apply_mode: {type: string, enum: [immediate, restart, migration]}
        pending: {type: boolean}
        version: {type: integer, minimum: 1}
        updated_by: {type: string}
        updated_at: {type: string, format: date-time}
    SettingVersion:
      type: object
      required: [id, key, version, before, after, reason, created_at]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        version: {type: integer, minimum: 1}
        before: {description: "Previous JSON value, masked when secret."}
        after: {description: "New JSON value, masked when secret."}
        changed_by: {type: string}
        reason: {type: string}
        created_at: {type: string, format: date-time}
    PublicSystemInfo:
      type: object
      required: [product, server_version]
      properties:
        product: {type: string, const: Invenqor}
        server_version: {type: string}
    AdminSystemInfo:
      allOf:
        - {$ref: "#/components/schemas/PublicSystemInfo"}
        - type: object
          required: [commit, build_time, database_mode, agent_auto_enrollment, agent_enrollment_mode, agent_enrollment_source]
          properties:
            commit: {type: string}
            build_time: {type: string}
            database_mode: {type: string}
            listen_address: {type: string}
            port: {type: integer, minimum: 1, maximum: 65535}
            agent_auto_enrollment: {type: boolean}
            agent_enrollment_mode: {type: string, enum: [disabled, open, token]}
            agent_enrollment_source: {type: string, enum: [database, startup-environment]}
            agent_enrollment_policy_available: {type: boolean}
            postgres_startup_failure: {type: object, additionalProperties: true}
    AssetVisualization:
      type: object
      required: [generated_at, window_days, stale_hours, filter, totals, dimensions, matrix, freshness, hierarchy, flow, graph]
      properties:
        generated_at: {type: string, format: date-time}
        window_days: {type: integer}
        stale_hours: {type: integer}
        filter: {type: object, additionalProperties: {type: string}}
        totals:
          type: object
          required: [assets, stale, fresh, unowned]
          properties:
            assets: {type: integer}
            stale: {type: integer}
            fresh: {type: integer}
            unowned: {type: integer}
        dimensions: {type: object, additionalProperties: {type: array, items: {type: object}}}
        matrix: {type: object}
        freshness: {type: array, items: {type: object}}
        hierarchy: {type: array, items: {type: object}}
        flow: {type: array, items: {type: object}}
        graph:
          type: object
          required: [nodes, edges, truncated, total_relations]
          properties:
            nodes: {type: array, items: {type: object}}
            edges: {type: array, items: {type: object}}
            truncated: {type: boolean}
            total_relations: {type: integer}
    AgentEnrollmentPolicy:
      type: object
      required: [enabled, mode, token_configured, network_mode, allowed_networks, trusted_proxies, version, updated_at, updated_by, source]
      properties:
        enabled: {type: boolean}
        mode: {type: string, enum: [disabled, open, token]}
        token_configured: {type: boolean}
        network_mode: {type: string, enum: [any, allowlist]}
        allowed_networks:
          type: array
          maxItems: 256
          items: {type: string}
        trusted_proxies:
          type: array
          maxItems: 64
          items: {type: string}
        version: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
        updated_by: {type: string}
        source: {type: string, const: database}
    DiagnosticLog:
      type: object
      required: [id, occurred_at, level, component, event_code, message, request_id, instance_id, agent_id, source_ip, details]
      properties:
        id: {type: string, format: uuid}
        occurred_at: {type: string, format: date-time}
        level: {type: string, enum: [info, warning, error]}
        component: {type: string}
        event_code: {type: string}
        message: {type: string}
        request_id: {type: string}
        instance_id: {type: string}
        agent_id: {type: string}
        source_ip: {type: string}
        details: {type: object, additionalProperties: true}
    OIDCSettings:
      type: object
      required:
        - enabled
        - issuer_url
        - client_id
        - redirect_uri
        - scopes
        - username_claim
        - role_mappings
        - group_mappings
        - auto_create_users
      properties:
        enabled: {type: boolean}
        issuer_url: {type: string, format: uri}
        realm: {type: string}
        client_id: {type: string}
        redirect_uri: {type: string, format: uri}
        logout_redirect_uri: {type: string, format: uri}
        scopes: {type: array, items: {type: string}, example: [openid, profile, email]}
        username_claim: {type: string, example: preferred_username}
        email_claim: {type: string, example: email}
        name_claim: {type: string, example: name}
        role_claim: {type: string, example: realm_access.roles}
        group_claim: {type: string, example: groups}
        role_mappings: {type: object, additionalProperties: {type: string}}
        group_mappings: {type: object, additionalProperties: {type: string}}
        auto_create_users: {type: boolean}
        default_role: {type: string, example: viewer}
        allowed_email_domains: {type: array, items: {type: string}}
        private_ca_pem: {type: string, writeOnly: true}
    UserCreate:
      type: object
      required: [username, password, roles]
      properties:
        username: {type: string}
        display_name: {type: string}
        email: {type: string, format: email}
        password: {type: string, format: password, writeOnly: true}
        roles: {type: array, minItems: 1, items: {type: string}}
        reason: {type: string}
    SoftwareEvidence:
      type: object
      required: [kind, name]
      properties:
        kind: {type: string, enum: [process, service, package]}
        name: {type: string}
        source_asset_id: {type: string, description: Collector source identity used to explain the detection}
    SoftwareHost:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    SoftwareProduct:
      type: object
      required:
        - id
        - asset_key
        - status
        - product_key
        - product_name
        - role
        - vendor
        - version
        - versions
        - install_state
        - runtime_state
        - service_names
        - process_names
        - package_names
        - executable_paths
        - evidence
        - detection_method
        - catalog_version
        - evidence_count
        - process_count
        - confidence
        - host
        - last_seen_at
      properties:
        id: {type: string, format: uuid}
        asset_key: {type: string}
        status: {type: string}
        product_key: {type: string}
        product_name: {type: string}
        role: {type: string}
        vendor: {type: string}
        version: {type: string}
        versions: {type: array, items: {type: string}}
        install_state: {type: string, enum: [installed, observed, unknown]}
        runtime_state: {type: string, enum: [running, stopped, unknown]}
        service_names: {type: array, items: {type: string}}
        process_names: {type: array, items: {type: string}}
        package_names: {type: array, items: {type: string}}
        executable_paths: {type: array, items: {type: string}}
        evidence: {type: array, items: {$ref: "#/components/schemas/SoftwareEvidence"}}
        detection_method: {type: string, example: builtin_catalog}
        catalog_version: {type: string}
        evidence_count: {type: integer, minimum: 0}
        process_count: {type: integer, minimum: 0}
        confidence: {type: number, minimum: 0, maximum: 1}
        host: {$ref: "#/components/schemas/SoftwareHost"}
        last_seen_at: {type: string, format: date-time}
    SoftwareProductAggregate:
      type: object
      required: [product_key, product_name, role, vendor, instances, hosts, running, versions]
      properties:
        product_key: {type: string}
        product_name: {type: string}
        role: {type: string}
        vendor: {type: string}
        instances: {type: integer}
        hosts: {type: integer}
        running: {type: integer}
        versions: {type: array, items: {type: string}}
    SoftwareInventorySummary:
      type: object
      required: [products, instances, hosts, running, stopped, runtime_unknown, installed, observed_only, high_confidence, needs_review, with_process_evidence, mapped_processes, top_products]
      properties:
        products: {type: integer}
        instances: {type: integer}
        hosts: {type: integer}
        running: {type: integer}
        stopped: {type: integer}
        runtime_unknown: {type: integer}
        installed: {type: integer}
        observed_only: {type: integer}
        high_confidence: {type: integer}
        needs_review: {type: integer}
        with_process_evidence: {type: integer}
        mapped_processes: {type: integer}
        top_products: {type: array, items: {$ref: "#/components/schemas/SoftwareProductAggregate"}}
    SoftwareInventoryPage:
      type: object
      required: [summary, items, total, limit, offset, has_more, filters]
      properties:
        summary: {$ref: "#/components/schemas/SoftwareInventorySummary"}
        items: {type: array, items: {$ref: "#/components/schemas/SoftwareProduct"}}
        total: {type: integer}
        limit: {type: integer}
        offset: {type: integer}
        has_more: {type: boolean}
        filters:
          type: object
          required: [roles, vendors]
          properties:
            roles: {type: array, items: {type: string}}
            vendors: {type: array, items: {type: string}}
    Envelope:
      type: object
      required: [schema_version, event_id, agent_id, created_at, kind, snapshot_hash]
      properties:
        schema_version: {type: integer, const: 1}
        event_id: {type: string, format: uuid}
        agent_id: {type: string, format: uuid}
        created_at: {type: integer}
        kind: {type: string, enum: [inventory, heartbeat]}
        snapshot_hash: {type: string}
        snapshot: {type: object}
        changes: {type: array, items: {type: object}}
        collection_errors: {type: array, items: {type: object}}
    UpdateManifest:
      type: object
      required: [version, channel, os, architecture, sha256, signature, signature_scheme, signature_version, download_url, size, rollout_percent]
      properties:
        version: {type: string}
        channel: {type: string, enum: [stable, beta]}
        os: {type: string, enum: [linux, windows]}
        architecture: {type: string, enum: [x86_64, aarch64]}
        sha256: {type: string, pattern: "^[0-9a-f]{64}$"}
        signature: {type: string, description: Artifact-only Ed25519 signature retained for pre-v2 bridge upgrades}
        manifest_signature: {type: string, description: Canonical metadata signature; present and required when signature_version is 2}
        signature_scheme: {type: string, const: ed25519}
        signature_version: {type: integer, enum: [1, 2]}
        download_url: {type: string}
        size: {type: integer, minimum: 1, maximum: 134217728}
        rollout_percent: {type: integer, minimum: 0, maximum: 100}
        allow_downgrade: {type: boolean}
        notes: {type: string}
    ApiKeyScope:
      type: string
      enum:
        - agents.read
        - assets.delete
        - assets.read
        - assets.write
        - mcp.access
        - queries.execute
        - relations.read
        - relations.write
