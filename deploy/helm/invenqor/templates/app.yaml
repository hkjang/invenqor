{{- $workloadName := printf "%s-invenqor" .Release.Name -}}
{{- $serviceSelector := dict "app.kubernetes.io/name" "invenqor" "app.kubernetes.io/instance" .Release.Name -}}
{{- $newStatefulSetSelector := dict "matchLabels" (dict "app" "invenqor" "app.kubernetes.io/name" "invenqor" "app.kubernetes.io/instance" .Release.Name) -}}
{{- $statefulSetSelector := deepCopy $newStatefulSetSelector -}}
{{- $podLabels := dict "app" "invenqor" "app.kubernetes.io/name" "invenqor" "app.kubernetes.io/instance" .Release.Name -}}
{{- $existingStatefulSet := lookup "apps/v1" "StatefulSet" .Release.Namespace $workloadName -}}
{{- if and $existingStatefulSet $existingStatefulSet.spec $existingStatefulSet.spec.selector -}}
  {{- $existingUsesStateClaim := false -}}
  {{- range $claim := ($existingStatefulSet.spec.volumeClaimTemplates | default list) -}}
    {{- if eq $claim.metadata.name "state" -}}
      {{- $existingUsesStateClaim = true -}}
    {{- end -}}
  {{- end -}}
  {{- if ne $existingUsesStateClaim .Values.persistence.enabled -}}
    {{- fail (printf "persistence.enabled cannot be changed in place for existing StatefulSet %s because volumeClaimTemplates is immutable; recreate the StatefulSet using the documented migration procedure" $workloadName) -}}
  {{- end -}}
  {{- $statefulSetSelector = deepCopy $existingStatefulSet.spec.selector -}}
  {{- if and $existingStatefulSet.spec.template $existingStatefulSet.spec.template.metadata $existingStatefulSet.spec.template.metadata.labels -}}
    {{- range $key, $value := $existingStatefulSet.spec.template.metadata.labels -}}
      {{- $_ := set $podLabels $key $value -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- $selectorLabels := get $statefulSetSelector "matchLabels" | default dict -}}
{{- if and (hasKey $selectorLabels "app.kubernetes.io/name") (ne (toString (get $selectorLabels "app.kubernetes.io/name")) "invenqor") -}}
  {{- fail (printf "existing StatefulSet %s has an incompatible app.kubernetes.io/name selector" $workloadName) -}}
{{- end -}}
{{- if and (hasKey $selectorLabels "app.kubernetes.io/instance") (ne (toString (get $selectorLabels "app.kubernetes.io/instance")) .Release.Name) -}}
  {{- fail (printf "existing StatefulSet %s belongs to a different Helm release instance" $workloadName) -}}
{{- end -}}
{{- range $key, $value := $selectorLabels -}}
  {{- $_ := set $podLabels $key $value -}}
{{- end -}}
{{- $_ := set $podLabels "app.kubernetes.io/name" "invenqor" -}}
{{- $_ = set $podLabels "app.kubernetes.io/instance" .Release.Name -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-invenqor-headless
  labels: {{- toYaml $serviceSelector | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- toYaml $serviceSelector | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-invenqor
  labels: {{- toYaml $serviceSelector | nindent 4 }}
spec:
  selector: {{- toYaml $serviceSelector | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
  type: {{ .Values.service.type }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-invenqor
  labels: {{- toYaml $serviceSelector | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-invenqor-headless
  replicas: {{ .Values.replicaCount }}
  podManagementPolicy: Parallel
  updateStrategy: {type: RollingUpdate}
  selector: {{- toYaml $statefulSetSelector | nindent 4 }}
  template:
    metadata:
      labels: {{- toYaml $podLabels | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, fsGroup: 65532}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: {{- toYaml $serviceSelector | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports: [{name: http, containerPort: 7070}]
          env:
            - {name: INVENQOR_LISTEN_ADDRESS, value: "0.0.0.0:7070"}
            - {name: INVENQOR_STATE_DIR, value: /var/lib/invenqor-server}
            - {name: INVENQOR_UPDATE_DIR, value: /var/lib/invenqor-updates}
            {{- if .Values.eventSpool.enabled }}
            - {name: INVENQOR_EVENT_SPOOL_DIR, value: /var/lib/invenqor-event-spool}
            {{- end }}
            - {name: INVENQOR_MASTER_KEY_FILE, value: /run/secrets/invenqor/master.key}
            - name: INVENQOR_AGENT_AUTO_ENROLLMENT
              value: {{ .Values.agentAutoEnrollment | quote }}
            {{- if .Values.bootstrapAdmin.username }}
            - name: INVENQOR_BOOTSTRAP_ADMIN
              value: {{ .Values.bootstrapAdmin.username | quote }}
            - name: INVENQOR_BOOTSTRAP_ADMIN_PASSWORD_FILE
              value: /run/secrets/invenqor-bootstrap/password
            {{- end }}
            - name: INVENQOR_POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.postgresDsnSecret.name }}, key: {{ .Values.postgresDsnSecret.key }}}
            {{- if .Values.agentEnrollmentTokenSecret.name }}
            - name: INVENQOR_AGENT_ENROLLMENT_TOKEN_FILE
              value: /run/secrets/invenqor-enrollment/enrollment.token
            {{- end }}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: state, mountPath: /var/lib/invenqor-server}
            - {name: updates, mountPath: /var/lib/invenqor-updates}
            {{- if .Values.eventSpool.enabled }}
            - {name: event-spool, mountPath: /var/lib/invenqor-event-spool}
            {{- end }}
            - {name: master-key, mountPath: /run/secrets/invenqor, readOnly: true}
            {{- if .Values.bootstrapAdmin.username }}
            - {name: bootstrap-admin-password, mountPath: /run/secrets/invenqor-bootstrap, readOnly: true}
            {{- end }}
            {{- if .Values.agentEnrollmentTokenSecret.name }}
            - {name: agent-enrollment-token, mountPath: /run/secrets/invenqor-enrollment, readOnly: true}
            {{- end }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: state
          emptyDir: {}
        {{- end }}
        - name: updates
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-invenqor-updates}
        {{- if .Values.eventSpool.enabled }}
        - name: event-spool
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-invenqor-event-spool" .Release.Name) .Values.eventSpool.existingClaim }}
        {{- end }}
        - name: master-key
          secret:
            secretName: {{ .Values.masterKeySecret.name }}
            defaultMode: 0440
        {{- if .Values.bootstrapAdmin.username }}
        - name: bootstrap-admin-password
          secret:
            secretName: {{ required "bootstrapAdmin.passwordSecret.name is required when bootstrapAdmin.username is set" .Values.bootstrapAdmin.passwordSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.bootstrapAdmin.passwordSecret.key }}
                path: password
        {{- end }}
        {{- if .Values.agentEnrollmentTokenSecret.name }}
        - name: agent-enrollment-token
          secret:
            secretName: {{ .Values.agentEnrollmentTokenSecret.name }}
            defaultMode: 0440
            items:
              - key: {{ .Values.agentEnrollmentTokenSecret.key }}
                path: enrollment.token
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: state
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: {{ .Values.persistence.size }}}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-invenqor-updates
spec:
  accessModes: [{{ .Values.updates.accessMode }}]
  {{- if .Values.updates.storageClassName }}
  storageClassName: {{ .Values.updates.storageClassName }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.updates.size }}}
{{- if and .Values.eventSpool.enabled (not .Values.eventSpool.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-invenqor-event-spool
spec:
  accessModes: [{{ .Values.eventSpool.accessMode }}]
  {{- if .Values.eventSpool.storageClassName }}
  storageClassName: {{ .Values.eventSpool.storageClassName }}
  {{- end }}
  resources:
    requests: {storage: {{ .Values.eventSpool.size }}}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-invenqor
  labels: {{- toYaml $serviceSelector | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels: {{- toYaml $serviceSelector | nindent 6 }}
