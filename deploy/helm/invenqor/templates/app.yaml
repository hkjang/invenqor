apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-invenqor
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: invenqor}
  template:
    metadata:
      labels: {app: invenqor}
    spec:
      securityContext: {runAsNonRoot: true, fsGroup: 65532}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: INVENQOR_LISTEN_ADDRESS, value: "0.0.0.0:8080"}
            - {name: INVENQOR_STATE_DIR, value: /var/lib/invenqor-server}
            - name: INVENQOR_POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: {{ .Values.postgresDsnSecret.name }}, key: {{ .Values.postgresDsnSecret.key }}}
          readinessProbe: {httpGet: {path: /health/ready, port: http}}
          livenessProbe: {httpGet: {path: /health/live, port: http}}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts: [{name: state, mountPath: /var/lib/invenqor-server}]
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: {{ .Release.Name }}-invenqor}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-invenqor
spec:
  selector: {app: invenqor}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
  type: {{ .Values.service.type }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-invenqor
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: {{ .Values.persistence.size }}}
