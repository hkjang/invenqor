replicaCount: 2
image:
  repository: ghcr.io/hkjang/invenqor-server
  tag: "0.2.24"
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 7070
ingress:
  enabled: false
  className: ""
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 130m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "90"
  hosts:
    - host: invenqor.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
persistence:
  # true creates one RWO state PVC per Pod; false uses ephemeral emptyDir.
  # This mode is immutable after the StatefulSet is installed.
  enabled: true
  size: 5Gi
updates:
  size: 2Gi
  accessMode: ReadWriteMany
  storageClassName: ""
eventSpool:
  enabled: true
  size: 5Gi
  accessMode: ReadWriteMany
  storageClassName: ""
  existingClaim: ""
postgresDsnSecret:
  name: invenqor-database
  key: dsn
masterKeySecret:
  name: invenqor-master-key
  key: master.key
bootstrapAdmin:
  username: ""
  passwordSecret:
    name: ""
    key: password
agentAutoEnrollment: true
agentEnrollmentTokenSecret:
  name: ""
  key: enrollment.token
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
