services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invenqor
      POSTGRES_USER: invenqor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenqor"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: .
    environment:
      INVENQOR_LISTEN_ADDRESS: 0.0.0.0:8080
      INVENQOR_STATE_DIR: /var/lib/invenqor-server
      INVENQOR_POSTGRES_DSN: postgres://invenqor:${POSTGRES_PASSWORD}@postgres:5432/invenqor?sslmode=disable
    volumes:
      - server-state:/var/lib/invenqor-server
    ports:
      - "${INVENQOR_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  server-state:
