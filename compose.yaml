services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: invenqor
      POSTGRES_USER: invenqor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invenqor"]
      interval: 5s
      timeout: 3s
      retries: 20
  server:
    build: .
    environment:
      INVENQOR_LISTEN_ADDRESS: 0.0.0.0:7070
      INVENQOR_STATE_DIR: /var/lib/invenqor-server
      INVENQOR_POSTGRES_DSN: ${POSTGRES_DSN:-postgres://invenqor:${POSTGRES_PASSWORD}@postgres:5432/invenqor?sslmode=disable}
      INVENQOR_BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-}
      INVENQOR_BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      INVENQOR_AGENT_AUTO_ENROLLMENT: ${AGENT_AUTO_ENROLLMENT:-true}
      INVENQOR_AGENT_ENROLLMENT_TOKEN: ${AGENT_ENROLLMENT_TOKEN:-}
    volumes:
      - server-state:/var/lib/invenqor-server
    ports:
      - "${INVENQOR_WEB_PORT:-7070}:7070"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
  server-state:
